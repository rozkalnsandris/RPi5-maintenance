name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate bootstrap
        run: make bootstrap-check
      - name: Validate extraction if present
        shell: bash
        run: |
          if [[ -f ops/bin/rpi5-update ]]; then
            make extraction-check
            find ops scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
            python3 -m compileall -q ops scripts tests
          else
            echo 'Bootstrap stage: canonical source extraction not committed yet.'
          fi
