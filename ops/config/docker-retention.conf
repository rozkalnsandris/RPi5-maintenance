# RPi5 Docker retention Phase 6 staged policy.
# Root-owned mode 0600 in production.
#
# off    = no provenance-aware report is run.
# report = create durable dry-run image/cache evidence only; never apply.
RETENTION_MODE=off

# Preserve the existing bounded dangling-image cleanup while the legacy V28
# core runs with DOCKER_CLEANUP=no.
RETENTION_DANGLING_IMAGE_CLEANUP=yes

# Explicit policy values for future report mode.
RETENTION_SUPERSEDED_KEEP_PER_LINEAGE=1
RETENTION_DISK_HIGH_WATERMARK_PERCENT=80
RETENTION_BUILD_CACHE_MAX_BYTES=8589934592
RETENTION_BUILDX_BUILDER=default
RETENTION_COMMAND_TIMEOUT_SECONDS=15

# Required before switching RETENTION_MODE=report. These stay empty in the
# staged source/default install so activation cannot guess production identity.
RETENTION_MAIN_PROJECT_DIR=
RETENTION_CV_PROJECT_DIR=
RETENTION_TRUSTED_EVIDENCE_RUNS=
